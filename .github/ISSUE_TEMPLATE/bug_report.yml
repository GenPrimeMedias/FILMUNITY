name: Bug report
description: Report a reproducible UNI360 defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include personal data, credentials, private documents or confidential organisation records."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UNI360 version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, PHP, database and browser versions. Do not share secrets.
