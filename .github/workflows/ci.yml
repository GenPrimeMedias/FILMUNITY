
name: FILMUNITY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: filmunity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Laravel and React CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: filmunity_test
          POSTGRES_USER: filmunity
          POSTGRES_PASSWORD: filmunity_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filmunity -d filmunity_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: filmunity_test
      DB_USERNAME: filmunity
      DB_PASSWORD: filmunity_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql, bcmath, intl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          cp .env .env.testing

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Production build
        run: npm run build

      - name: Frontend checks
        run: |
          npm run check
          npm run types:check

      - name: PHP formatting
        run: composer lint:check

      - name: PHP static analysis
        run: composer types:check

      - name: Laravel tests
        run: php artisan test
