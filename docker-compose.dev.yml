services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: uni360
            POSTGRES_USER: uni360
            POSTGRES_PASSWORD: local_only_change_me
        ports:
            - '5432:5432'
        volumes:
            - uni360_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U uni360 -d uni360']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    uni360_pgdata:
