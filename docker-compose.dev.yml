services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: filmunity
            POSTGRES_USER: filmunity
            POSTGRES_PASSWORD: local_only_change_me
        ports:
            - '5432:5432'
        volumes:
            - filmunity_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U filmunity -d filmunity']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    filmunity_pgdata:
